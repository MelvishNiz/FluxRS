name: Pages

# Builds the browser UI (WebAssembly) and publishes it to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main, master, claude/determined-mendel-5z4kol]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
      - ".github/scripts/install-wasm-tools.sh"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5

      # Without Pages enabled, deploying fails: build anyway, then skip the
      # deploy with a clear warning instead of a red run.
      - name: Check GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is not enabled::Open Settings -> Pages, set Source to 'GitHub Actions', then re-run this workflow."
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen
        run: .github/scripts/install-wasm-tools.sh

      - name: Build web UI
        run: |
          crates/fluxrs-app/web/build.sh
          touch crates/fluxrs-app/web/dist/.nojekyll

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v4
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: crates/fluxrs-app/web/dist

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
