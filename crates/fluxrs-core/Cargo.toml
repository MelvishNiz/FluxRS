[package]
name = "fluxrs-core"
description = "Rust HTTP(S) MITM engine with proxyless capture, rewrite rules and interception (Rust port of fluxzy.core concepts)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fluxrs-model = { path = "../fluxrs-model" }
tokio = { version = "1.47", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
hyper = { version = "1.7", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http-body = "1"
http = "1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
rcgen = { version = "0.14", features = ["x509-parser"] }
x509-parser = "0.18"
time = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
flate2 = "1"
brotli = "8"
thiserror = "2"
tracing = "0.1"
parking_lot = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"

[dev-dependencies]
tokio = { version = "1.47", features = ["full"] }
tempfile = "3"
