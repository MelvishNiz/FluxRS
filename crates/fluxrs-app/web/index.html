<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>FluxRS — HTTP Debugger</title>
  <link rel="icon" href="fluxrs.png" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0c10; }
    #fluxrs_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; color: #9aa3b5; font: 14px system-ui, sans-serif; pointer-events: none; }
    #loading img { width: 56px; height: 56px; }
  </style>
</head>
<body>
  <canvas id="fluxrs_canvas"></canvas>
  <div id="loading"><img src="fluxrs.png" alt="" />Loading FluxRS…</div>
  <script type="module">
    import init from "./fluxrs.js";
    init().catch((e) => {
      document.getElementById("loading").textContent = "FluxRS failed to load: " + e;
    });
  </script>
</body>
</html>
