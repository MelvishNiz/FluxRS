[package]
name = "fluxrs-app"
description = "FluxRS - modern proxyless HTTP debugger for Windows (GUI)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "fluxrs"
path = "src/main.rs"

[dependencies]
fluxrs-model = { path = "../fluxrs-model" }
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "accesskit",
    "clipboard",
    "links",
    "x11",
    "wayland",
] }
# Emoji/icon glyphs used across the UI.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "0.37", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
bytes = "1"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fluxrs-core = { path = "../fluxrs-core" }
dirs = "6"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
getrandom = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
signal-hook = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
ewebsock = "0.8"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "Element", "HtmlCanvasElement", "console"] }

[build-dependencies]
embed-manifest = "1.4"

[package.metadata.deb]
name = "fluxrs"
maintainer = "FluxRS contributors"
copyright = "FluxRS contributors, GPL-3.0"
extended-description = "Proxyless HTTP/HTTPS debugger: capture, intercept and rewrite traffic. Proxyless mode uses iptables (asks for admin rights through pkexec)."
section = "net"
priority = "optional"
depends = "$auto, libxkbcommon-x11-0, libgl1, iptables, pkexec | policykit-1, ca-certificates"
recommends = "libnss3-tools"
assets = [
    ["target/release/fluxrs", "usr/bin/", "755"],
    ["assets/linux/fluxrs.desktop", "usr/share/applications/", "644"],
    ["assets/linux/fluxrs.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["web/dist/*", "usr/share/fluxrs/web/", "644"],
]
